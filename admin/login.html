<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Administrativo | Tour del Café Gran Fondo</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/x-icon" href="../favicon.ico">

  <!-- Fuentes Oficiales -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0e0d0c;
      --card-bg: #161413;
      --card-inner: #1e1b19;
      --accent: #d35400;
      --accent-hover: #e67e22;
      --accent-glow: rgba(211, 84, 0, 0.35);
      --text-main: #fafafa;
      --text-muted: rgba(250, 250, 250, 0.65);
      --border: rgba(255, 255, 255, 0.09);
      --border-accent: rgba(211, 84, 0, 0.35);
      --danger: #e74c3c;
      --font-heading: 'Cinzel', serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-image: 
        radial-gradient(circle at 50% 10%, rgba(211, 84, 0, 0.14) 0%, transparent 60%),
        radial-gradient(circle at 10% 90%, rgba(230, 126, 34, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 90% 90%, rgba(211, 84, 0, 0.05) 0%, transparent 50%);
    }

    .login-container {
      width: 100%;
      max-width: 440px;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-logo-img {
      height: 70px;
      width: auto;
      margin-bottom: 0;
      filter: drop-shadow(0 4px 15px rgba(0, 0, 0, 0.6));
    }

    .brand-title {
      font-family: var(--font-heading);
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #ffffff;
      text-transform: uppercase;
    }

    .brand-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
      letter-spacing: 0.5px;
    }

    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7), 0 0 40px rgba(211, 84, 0, 0.08);
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent), var(--accent-hover), transparent);
    }

    .card-header-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(211, 84, 0, 0.15);
      border: 1px solid var(--border-accent);
      color: var(--accent-hover);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 16px;
    }

    .login-card h2 {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
    }

    .login-card p.desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper input {
      width: 100%;
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 14px;
      color: #fff;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-wrapper input:focus {
      border-color: var(--accent-hover);
      box-shadow: 0 0 0 3px rgba(211, 84, 0, 0.2);
      background: #24201d;
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #d35400 0%, #b84300 100%);
      border: none;
      border-radius: 8px;
      padding: 14px 20px;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 6px 20px rgba(211, 84, 0, 0.35);
      transition: all 0.25s ease;
      margin-top: 10px;
    }

    .btn-submit:hover:not(:disabled) {
      background: linear-gradient(135deg, #e67e22 0%, #d35400 100%);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(211, 84, 0, 0.45);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .alert-box {
      background: rgba(231, 76, 60, 0.15);
      border: 1px solid rgba(231, 76, 60, 0.35);
      color: #ff7675;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 8px;
    }

    .alert-box.show {
      display: flex;
      animation: shake 0.3s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }

    .footer-links {
      margin-top: 24px;
      text-align: center;
    }

    .footer-links a {
      color: var(--text-muted);
      font-size: 12px;
      text-decoration: none;
      transition: color 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .footer-links a:hover {
      color: var(--accent-hover);
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="brand-header">
      <img src="../assets/logo-gran-fondo.png" alt="Tour del Café Gran Fondo" class="brand-logo-img" onerror="this.src='../assets/photo-mitico.jpg'">
    </div>

    <div class="login-card">
      <div class="card-header-badge">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        Consola de Administración
      </div>

      <h2>Acceso Seguro</h2>
      <p class="desc">
        Ingresa tus credenciales autorizadas para gestionar inscripciones, cupones y reportes del festival.
      </p>

      <div class="alert-box" id="error-alert">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        <span id="error-message">Credenciales incorrectas.</span>
      </div>

      <form id="admin-login-form">
        <div class="form-group">
          <label class="form-label" for="login-username">Usuario</label>
          <div class="input-wrapper">
            <input type="text" id="login-username" name="username" placeholder="admin" required autocomplete="username" autofocus>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Contraseña</label>
          <div class="input-wrapper">
            <input type="password" id="login-password" name="password" placeholder="••••••••••••" required autocomplete="current-password">
          </div>
        </div>

        <button type="submit" class="btn-submit" id="btn-login">
          <span>Entrar al Panel</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
      </form>
    </div>

    <div class="footer-links">
      <a href="../inscripciones.html">
        ← Volver al Portal de Inscripciones
      </a>
    </div>
  </div>

  <script>
    const form = document.getElementById('admin-login-form');
    const btnSubmit = document.getElementById('btn-login');
    const alertBox = document.getElementById('error-alert');
    const errorMsg = document.getElementById('error-message');

    // Comprobar si ya existe sesión válida
    (async function checkExistingSession() {
      try {
        const res = await fetch('/api/admin/check-session');
        const data = await res.json();
        if (data.authenticated) {
          window.location.href = '/admin/dashboard.html';
        }
      } catch (e) {}
    })();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.remove('show');

      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;

      btnSubmit.disabled = true;
      btnSubmit.innerHTML = `<span>Verificando credenciales...</span>`;

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          if (data.token) {
            localStorage.setItem('tdc_admin_token', data.token);
            sessionStorage.setItem('tdc_admin_token', data.token);
          }
          window.location.href = '/admin/dashboard.html';
        } else {
          errorMsg.textContent = data.error || 'Credenciales no autorizadas.';
          alertBox.classList.add('show');
        }
      } catch (err) {
        errorMsg.textContent = 'Error de conexión con el servidor. Intenta de nuevo.';
        alertBox.classList.add('show');
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = `
          <span>Entrar al Panel</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        `;
      }
    });
  </script>

</body>
</html>
